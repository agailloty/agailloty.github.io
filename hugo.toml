heroSubtitle = "Developpement logiciel, projets open source et articles techniques."

[[languages.fr.params.home.sections]]
type    = "blog"
title   = "Derniers articles"
count   = 3
layout  = "list"
moreUrl = "/blog/"

[[languages.fr.params.home.sections]]

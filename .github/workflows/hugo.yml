# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Website

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

# Default to bash
defaults:
  run:
    shell: bash
jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.150.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${{HUGO_VERSION}}/hugo_extended_${{HUGO_VERSION}}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: false

      - name: Checkout theme (kyrie) pinned to tag
        run: |
          rm -rf themes/kyrie
          git clone https://github.com/agailloty/kyrie themes/kyrie
          cd themes/kyrie
          # attendre que le workflow de release du thème ait poussé le tag (max ~3 min)
          for i in $(seq 1 12); do
            git fetch --tags --force
            if git rev-parse "refs/tags/v0.4.0" >/dev/null 2>&1; then
              git checkout v0.4.0
              echo "Thème kyrie sur le tag v0.4.0 ($(git rev-parse --short HEAD))"
              exit 0
            fi
            echo "Tag v0.4.0 pas encore disponible, nouvelle tentative dans 15s…"
            sleep 15
          done
          echo "ERREUR: tag v0.4.0 introuvable" >&2
          exit 1

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v3

      - name: Build with Hugo
        env:
          # For maximum backward compatibility with Hugo modules
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"


      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # Deployment job
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
